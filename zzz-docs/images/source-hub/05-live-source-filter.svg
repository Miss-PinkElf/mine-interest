<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="t5 d5">
  <title id="t5">活水源筛选</title>
  <desc id="d5">高噪声活水源必须先判断值不值得留下。系统给候选，判断权不做成全自动。</desc>
  <rect width="1280" height="700" fill="#F3F0E9"/>

  <text x="64" y="52" font-family="'IBM Plex Sans', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" letter-spacing="3.2" fill="#8A8378">SOURCE HUB  ·  05</text>
  <text x="64" y="92" font-family="'IBM Plex Sans', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500" fill="#1C1916">活水源怎么进，才不会变成垃圾桶</text>
  <text x="64" y="124" font-family="'IBM Plex Sans', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#6F685F">全量灌会淹没；全靠人点又太累。系统提供候选，人做去留。</text>

  <g font-family="'IBM Plex Sans', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64,176)">
      <rect width="272" height="280" fill="#FFFCF7" stroke="#1C1916" stroke-width="1.15"/>
      <text x="24" y="40" font-size="12" letter-spacing="1.8" fill="#8A8378">01</text>
      <text x="24" y="80" font-size="22" fill="#1C1916">粗收</text>
      <text x="24" y="120" font-size="14" fill="#6F685F">来源层先留下原文</text>
      <text x="24" y="148" font-size="14" fill="#6F685F">时间和来源不丢</text>
      <text x="24" y="176" font-size="14" fill="#6F685F">媒体一并保存</text>
      <text x="24" y="232" font-size="13" fill="#8A8378">先能回到那张图</text>
      <text x="24" y="256" font-size="13" fill="#8A8378">和那句原话</text>
    </g>

    <path d="M336 316 H392" stroke="#1C1916" stroke-width="1.15"/>

    <g transform="translate(392,176)">
      <rect width="272" height="280" fill="#FFFCF7" stroke="#1C1916" stroke-width="1.15"/>
      <text x="24" y="40" font-size="12" letter-spacing="1.8" fill="#8A8378">02</text>
      <text x="24" y="80" font-size="22" fill="#1C1916">LLM 建议</text>
      <text x="24" y="120" font-size="14" fill="#6F685F">值不值得留下</text>
      <text x="24" y="148" font-size="14" fill="#6F685F">候选标签</text>
      <text x="24" y="176" font-size="14" fill="#6F685F">可能所属主题</text>
      <text x="24" y="232" font-size="13" fill="#8A8378">全靠规则会漏</text>
      <text x="24" y="256" font-size="13" fill="#8A8378">全靠模型又贵又偏</text>
    </g>

    <path d="M664 316 H720" stroke="#1C1916" stroke-width="1.15"/>

    <g transform="translate(720,176)">
      <rect width="272" height="280" fill="#1C1916"/>
      <text x="24" y="40" font-size="12" letter-spacing="1.8" fill="#C9B8A4">03</text>
      <text x="24" y="80" font-size="22" fill="#FFFCF7">人做去留</text>
      <text x="24" y="120" font-size="14" fill="#C9B8A4">尤其是图片</text>
      <text x="24" y="148" font-size="14" fill="#C9B8A4">一句闲聊</text>
      <text x="24" y="176" font-size="14" fill="#C9B8A4">以后可能有用的项目</text>
      <text x="24" y="232" font-size="13" fill="#8A8378">判断权不下放</text>
      <text x="24" y="256" font-size="13" fill="#8A8378">成全自动</text>
    </g>

    <path d="M992 316 H1048" stroke="#1C1916" stroke-width="1.15"/>

    <g transform="translate(1048,176)">
      <rect width="168" height="280" fill="#FFFCF7" stroke="#1C1916" stroke-width="1.15"/>
      <text x="20" y="40" font-size="12" letter-spacing="1.8" fill="#8A8378">04</text>
      <text x="20" y="88" font-size="20" fill="#1C1916">编译</text>
      <text x="20" y="128" font-size="14" fill="#6F685F">摘要</text>
      <text x="20" y="156" font-size="14" fill="#6F685F">标签</text>
      <text x="20" y="184" font-size="14" fill="#6F685F">主题页</text>
      <text x="20" y="240" font-size="13" fill="#8A8378">整理错了</text>
      <text x="20" y="264" font-size="13" fill="#8A8378">还能重编</text>
    </g>

  </g>

  <g font-family="'IBM Plex Sans', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif">
    <line x1="64" y1="492" x2="1216" y2="492" stroke="#D8D1C5" stroke-width="1"/>
    <text x="64" y="536" font-size="15" fill="#1C1916">不想断舍离，所以系统必须容纳「现在不一定有用、以后可能有用」。</text>
    <text x="64" y="566" font-size="15" fill="#6F685F">但不能因此放弃筛选。判断权留在人这边，整理错了还可以回到原文重编。</text>
  </g>
</svg>
